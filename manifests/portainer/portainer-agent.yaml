# Portainer Agent for the k3s cluster.
#
# Lets the Portainer server (https://portainer.jinkies.net, running on dixie)
# manage this cluster as a Kubernetes environment. Based on Portainer's
# generated portainer-agent-k8s-lb.yaml, with the image pinned to the
# version that matches the server.
#
# Apply with:  kubectl apply -f manifests/portainer/portainer-agent.yaml
# Upgrade:     bump `image:` below, re-apply, then Portainer picks it up on
#              its next environment snapshot.
---
apiVersion: v1
kind: Namespace
metadata:
  name: portainer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer-sa-clusteradmin
  namespace: portainer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer-crb-clusteradmin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: portainer-sa-clusteradmin
    namespace: portainer
---
# Headless service used by the agent for cluster-mode peer discovery
# (AGENT_CLUSTER_ADDR). Required even with a single replica.
apiVersion: v1
kind: Service
metadata:
  name: portainer-agent-headless
  namespace: portainer
spec:
  clusterIP: None
  selector:
    app: portainer-agent
---
# LAN-facing endpoint the Portainer server connects to.
#
# NodePort rather than a MetalLB LoadBalancer on purpose: this is the
# management plane, so it should not depend on MetalLB being healthy, and
# with a single control-plane node there is nothing for a floating IP to
# fail over to anyway. Reach it on any node IP, e.g. 192.168.2.31:30778
# (30778 is the port Portainer's own NodePort manifest uses).
apiVersion: v1
kind: Service
metadata:
  name: portainer-agent
  namespace: portainer
spec:
  type: NodePort
  selector:
    app: portainer-agent
  ports:
    - name: http
      protocol: TCP
      port: 9001
      targetPort: 9001
      nodePort: 30778
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer-agent
  namespace: portainer
spec:
  selector:
    matchLabels:
      app: portainer-agent
  template:
    metadata:
      labels:
        app: portainer-agent
    spec:
      serviceAccountName: portainer-sa-clusteradmin
      containers:
        - name: portainer-agent
          # Keep in step with the Portainer server version (Home > About in the UI).
          image: portainer/agent:2.45.0
          imagePullPolicy: Always
          env:
            - name: LOG_LEVEL
              value: DEBUG
            - name: AGENT_CLUSTER_ADDR
              value: portainer-agent-headless
            - name: KUBERNETES_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 9001
              protocol: TCP
